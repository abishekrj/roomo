<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Reservations | ROOMO Sacred</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
</head>
<body class="my-bookings-page">
  <div id="roomoHeader"></div>
  <main class="page stay-detail-page-wrap">
    <section class="detail-section">
      <span class="detail-eyebrow">YOUR ROOMO JOURNEY</span>
      <h1 class="booking-page-title">My Pilgrimage Bookings</h1>
      <p class="detail-muted">Review your reservations and keep your favourite sacred stays together in one place.</p>
      <p id="myBookingsMessage" class="availability-message" aria-live="polite"></p>
      <div id="myBookingsList"><div class="detail-loading">Loading your reservations…</div></div>
      <section class="favorites-section" aria-labelledby="myFavoritesHeading">
        <div class="favorites-section-heading"><span class="detail-eyebrow">SAVED FOR YOUR JOURNEY</span><h2 id="myFavoritesHeading">My favourite stays</h2><p class="detail-muted">The sanctuaries you saved from the search listings.</p></div>
        <p id="myFavoritesMessage" class="availability-message" aria-live="polite"></p>
        <div id="myFavoritesList"><div class="detail-loading">Loading your favourite stays…</div></div>
      </section>
    </section>
  </main>
  <div id="roomoFooter"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/header.js"></script>
</body>
</html>
