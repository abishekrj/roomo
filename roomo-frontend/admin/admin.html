<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>ROOMO Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../js/favicon.js"></script>
  </head>
  <body data-page="login">
    <header class="topbar">
      <a class="brand admin-login-brand" href="../index.html" aria-label="ROOMO Sacred home" style="text-decoration:none">ROOMO <span>PROPERTY MANAGEMENT</span></a>
    </header>
    <main class="page">
      <section class="login-wrap">
        <div class="panel">
          <h1>Welcome back</h1>
          <p class="muted">Sign in with your ROOMO administrator account.</p>
          <div id="pageNotice" class="notice" role="alert"></div>
          <form id="loginForm">
            <div style="margin-bottom:18px">
              <label for="loginEmail">Email address</label>
              <input id="loginEmail" type="email" autocomplete="username" required maxlength="254">
            </div>
            <div style="margin-bottom:22px">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" type="password" autocomplete="current-password" required maxlength="72">
            </div>
            <button id="loginButton" class="button button-primary" type="submit" style="width:100%">Sign in to dashboard</button>
          </form>
          <p class="muted small" style="margin-top:20px">Administrator permissions are verified by the ROOMO backend.</p>
        </div>
      </section>
    </main>
    <footer class="admin-footer"><div class="admin-footer-inner"><strong>ROOMO Sacred</strong><span>© 2026 ROOMO Sacred. All rights reserved.</span><span>Secure administrator access</span></div></footer>
    <script src="js/admin.js" defer></script>
  </body>
</html>
