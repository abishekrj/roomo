<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Room Types | ROOMO Owner Portal"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>:root{--blue:#2463eb;--ink:#14243b;--muted:#718096;--border:#e4eaf2;--surface:#f5f8fc;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--surface)}*{box-sizing:border-box}body{margin:0;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer;border-radius:8px;padding:10px 14px;border:1px solid #d6deea;background:#fff;color:#263447}button.primary{background:#174ea6;border-color:#174ea6;color:#fff}button:disabled{opacity:.6}.topbar{background:#fff;border-bottom:1px solid #e3e8ef;padding:16px max(20px,calc((100% - 1400px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:700;font-size:22px;color:#174ea6}.brand small{display:block;font-size:11px;letter-spacing:1.5px;color:#68778b;font-weight:400}.layout{max-width:1400px;margin:auto;padding:28px 24px 50px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}.sidebar{background:#102747;color:#fff;border-radius:12px;padding:18px 12px;height:max-content;position:sticky;top:20px}.sidebar h3{font-size:11px;letter-spacing:1.5px;color:#9eb1cc;margin:4px 10px 14px}.sidebar a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#d8e3f2;padding:11px;border-radius:8px;margin:3px 0}.sidebar a.active,.sidebar a:hover{background:#1e416e;color:#fff}.main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.heading h1{font-family:Manrope,sans-serif;font-size:clamp(25px,3vw,34px);margin:0 0 6px}.muted{color:var(--muted);line-height:1.5}.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:18px}.panel h2{font:700 18px Manrope,sans-serif;margin:0 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field label{font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid #d6deea;border-radius:8px;padding:10px 12px;background:#fff}.field textarea{min-height:80px;resize:vertical}.helper{font-size:12px;color:var(--muted)}.notice{display:none;padding:12px 14px;border-radius:8px;margin-bottom:16px;background:#eaf2ff;color:#174ea6}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a32626}.notice.success{background:#eaf8ef;color:#17663a}.typecard{display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.typecard img{width:88px;height:82px;object-fit:cover;border-radius:8px;background:#edf1f6}.typecard h3{margin:0 0 5px}.meta{font-size:12px;color:var(--muted);margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:var(--muted);font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:16px}.sidebar{position:static}.sidebar nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:16px}.typecard{grid-template-columns:68px minmax(0,1fr)}.typecard img{width:68px;height:68px}}</style></head><body>
<header class="topbar"><div class="brand">ROOMO <small>OWNER PORTAL</small></div><button id="logout">Sign out</button></header>
<div class="layout"><aside class="sidebar"><h3>OWNER WORKSPACE</h3><nav><a href="dashboard.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a><a href="my-properties.html"><i class="bi bi-houses-fill"></i> My Properties</a><a href="room-types.html" class="active"><i class="bi bi-door-open-fill"></i> Room Types</a><a href="enquiries.html"><i class="bi bi-envelope-paper-fill"></i> Enquiries</a><a href="reports.html"><i class="bi bi-bar-chart-line-fill"></i> Reports</a></nav></aside>
<main class="main"><div id="notice" class="notice" role="status"></div><div class="heading"><div><h1>Room Types</h1><div class="muted">Manage room categories for your properties. This feature is available when ROOMO administration enables property editing.</div></div><button id="refresh">Refresh</button></div>
<section class="panel"><h2>Choose your property</h2><p class="muted">Room types are managed separately for each property.</p><div class="field"><label for="property">Property</label><select id="property"><option value="">Loading properties…</option></select></div></section>
<section class="panel"><h2 id="formHeading">Add a room type</h2><p class="muted">Examples: Single Bed Room, Double Bed Room, Deluxe Room, Super Deluxe Room, Full Apartment.</p><form id="form" class="formgrid"><input id="id" type="hidden"><div class="field"><label for="name">Room type name *</label><input id="name" required minlength="2" maxlength="120" placeholder="Deluxe Room"></div><div class="field"><label for="price">Nightly price (₹) *</label><input id="price" type="number" min="1" step=".01" required></div><div class="field"><label for="guests">Maximum guests *</label><input id="guests" type="number" min="1" max="100" value="2" required></div><div class="field"><label for="quantity">Units available *</label><input id="quantity" type="number" min="0" max="10000" value="1" required></div><div class="field full"><label for="description">Description</label><textarea id="description" maxlength="5000"></textarea></div><div class="field"><label for="beds">Bed configuration</label><textarea id="beds" placeholder="1 King Bed&#10;2 Single Beds"></textarea><span class="helper">One bed configuration per line.</span></div><div class="field"><label for="facilities">Facilities</label><textarea id="facilities" placeholder="Air conditioning, Free WiFi"></textarea></div><div class="field full"><label for="images">Room image URLs</label><textarea id="images" placeholder="One https:// image URL per line (up to 10)"></textarea></div><div class="field"><label for="order">Display order</label><input id="order" type="number" min="0" value="0"></div><div class="field"><label><input id="active" type="checkbox" checked> Active and available to guests</label></div><div class="field full actions"><button id="save" class="primary" type="submit">Save room type</button><button id="clear" type="button">Clear form</button></div></form></section>
<section class="panel"><h2 id="listHeading">Room types</h2><p id="count" class="muted">Select a property.</p><div id="list"></div><p id="empty" class="empty">No room types found.</p></section>
</main></div>
<script>(()=>{"use strict";const API="http://localhost:5001/api",KEY="roomoOwnerToken",$=id=>document.getElementById(id);let token=sessionStorage.getItem(KEY),properties=[],types=[];
function notice(s,t="info"){$("notice").textContent=s;$("notice").className="notice show "+t}
async function request(path,options={}){let r;try{r=await fetch(API+path,{...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),Authorization:"Bearer "+token}})}catch{throw Error("Cannot connect to ROOMO API on port 5001.")}const d=await r.json().catch(()=>({}));if(!r.ok){const e=Error(d.message||"Request failed ("+r.status+")");e.status=r.status;throw e}return d}
const lines=s=>s.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
const beds=s=>s.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d+)\s+(.+)$/);return m?{count:+m[1],type:m[2]}:{count:1,type:x}});
function clear(){ $("form").reset();$("id").value="";$("guests").value=2;$("quantity").value=1;$("order").value=0;$("active").checked=true;$("formHeading").textContent="Add a room type";$("save").textContent="Save room type"}
function edit(x){$("id").value=x.id;$("name").value=x.name;$("price").value=x.nightlyPrice;$("guests").value=x.maxGuests;$("quantity").value=x.quantity;$("description").value=x.description||"";$("beds").value=(x.bedConfiguration||[]).map(b=>b.count+" "+b.type).join("\n");$("facilities").value=(x.facilities||[]).join(", ");$("images").value=(x.imageUrls||[]).join("\n");$("order").value=x.sortOrder||0;$("active").checked=!!x.isActive;$("formHeading").textContent="Edit room type";$("save").textContent="Update room type";window.scrollTo({top:0,behavior:"smooth"})}
function render(){ $("list").replaceChildren();$("count").textContent=types.length+" room type"+(types.length===1?"":"s");$("empty").style.display=types.length?"none":"block";types.forEach(x=>{const card=document.createElement("article");card.className="typecard";const img=document.createElement("img");img.src=(x.imageUrls||[])[0]||"";img.alt=x.name;if(!img.src)img.style.visibility="hidden";const body=document.createElement("div"),h=document.createElement("h3");h.textContent=x.name;const desc=document.createElement("div");desc.className="muted";desc.textContent=x.description||"No description";const meta=document.createElement("div");meta.className="meta";meta.textContent="₹"+Number(x.nightlyPrice).toLocaleString("en-IN")+" / night · "+x.maxGuests+" guests · "+x.quantity+" units · "+(x.isActive?"Active":"Inactive");const beds=document.createElement("div");beds.className="meta";beds.textContent="Beds: "+((x.bedConfiguration||[]).map(b=>b.count+" "+b.type).join(", ")||"Not specified");const actions=document.createElement("div");actions.className="actions";const eb=document.createElement("button");eb.textContent="Edit";eb.onclick=()=>edit(x);const db=document.createElement("button");db.textContent="Delete";db.onclick=async()=>{if(!confirm("Delete "+x.name+"?"))return;try{const d=await request("/room-types/owner/"+x.id,{method:"DELETE"});notice(d.message,"success");await loadTypes()}catch(e){notice(e.message,"error")}};actions.append(eb,db);body.append(h,desc,meta,beds,actions);card.append(img,body);$("list").append(card)})}
async function loadProperties(){const d=await request("/room-types/owner/properties");properties=d.properties||[];const s=$("property");s.replaceChildren();const opt=document.createElement("option");opt.value="";opt.textContent="Select a property";s.append(opt);properties.forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.title+" — "+[p.city,p.state].filter(Boolean).join(", ");s.append(o)})}
async function loadTypes(){types=[];render();const id=$("property").value;if(!id)return;const d=await request("/room-types/owner?propertyId="+encodeURIComponent(id));types=d.roomTypes||[];$("listHeading").textContent="Room types · "+(properties.find(p=>p.id===id)?.title||"Selected property");render()}
$("property").onchange=async()=>{clear();try{await loadTypes()}catch(e){notice(e.message,"error")}};$("clear").onclick=clear;$("refresh").onclick=async()=>{try{await loadProperties();await loadTypes();notice("Room types refreshed.","success")}catch(e){notice(e.message,"error")}};
$("form").onsubmit=async e=>{e.preventDefault();const propertyId=$("property").value;if(!propertyId){notice("Choose a property first.","error");return}const id=$("id").value;const data={propertyId,name:$("name").value.trim(),description:$("description").value.trim(),nightlyPrice:+$("price").value,maxGuests:+$("guests").value,quantity:+$("quantity").value,bedConfiguration:beds($("beds").value),facilities:lines($("facilities").value),imageUrls:lines($("images").value),sortOrder:+$("order").value||0,isActive:$("active").checked};if(data.imageUrls.length>10)return notice("Use no more than 10 image URLs.","error");$("save").disabled=true;try{const d=await request(id?"/room-types/owner/"+id:"/room-types/owner",{method:id?"PATCH":"POST",body:JSON.stringify(id?Object.fromEntries(Object.entries(data).filter(([k])=>k!=="propertyId")):data)});notice(d.message||"Room type saved.","success");clear();await loadTypes()}catch(e){notice(e.message,"error")}finally{$("save").disabled=false}};
$("logout").onclick=()=>{sessionStorage.removeItem(KEY);location.replace("admin.html")};
(async()=>{if(!token){location.replace("admin.html");return}try{await loadProperties();await loadTypes()}catch(e){notice(e.message,"error");if(e.status===401){sessionStorage.removeItem(KEY);location.replace("admin.html")}}})();
})();</script></body></html>
