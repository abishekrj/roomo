name: ROOMO backend regression tests

on:
  push:
    paths:
      - "staging/backend/**"
      - ".github/workflows/roomo-backend-tests.yml"
  pull_request:
    paths:
      - "staging/backend/**"
      - ".github/workflows/roomo-backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staging/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: staging/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend security regression tests
        run: npm test
