name: ROOMO security and build checks

on:
  push:
    paths:
      - "staging/backend/**"
      - "staging/src/**"
      - "staging/package.json"
      - "staging/package-lock.json"
      - ".github/workflows/roomo-backend-tests.yml"
  pull_request:
    paths:
      - "staging/backend/**"
      - "staging/src/**"
      - "staging/package.json"
      - "staging/package-lock.json"
      - ".github/workflows/roomo-backend-tests.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staging/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: staging/backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://roomo:roomo@localhost:5432/roomo_dev?schema=public
      - name: Run backend security regression tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build React frontend
        run: npm run build
