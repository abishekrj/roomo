<section class="py-5 border-bottom" id="sacredGallery">
  <div class="container">
    <div class="row align-items-center justify-content-between mb-4">
      <div class="col-lg-8">
        <span class="badge px-3 py-1 rounded-pill mb-2 font-cinzel border" style="color:#0f2c59"><i class="bi bi-camera me-1"></i> Visual Archives</span>
        <h2 class="display-6 fw-bold text-dark mb-1 font-serif-sacred">Sacred Glimpses of Tiruvannamalai</h2>
        <p class="text-muted small mb-0">Explore images and videos of holy Arunachala, historic gopurams and tranquil meditation halls.</p>
      </div>
      <div class="col-lg-4 text-lg-end mt-3 mt-lg-0"><span class="small font-cinzel fw-bold"><i class="bi bi-collection me-1"></i> Devotional Visual Archive</span></div>
    </div>
    <div class="gallery-tabs d-flex align-items-center gap-2 pb-3 mb-4" role="tablist" aria-label="Gallery media type">
      <button class="gallery-tab-heritage active font-cinzel" id="galleryImagesTab" type="button" role="tab" aria-selected="true" data-gallery-type="IMAGE"><i class="bi bi-images me-1"></i> Images</button>
      <button class="gallery-tab-heritage font-cinzel" id="galleryVideosTab" type="button" role="tab" aria-selected="false" data-gallery-type="VIDEO"><i class="bi bi-play-btn me-1"></i> Videos</button>
    </div>
    <div class="row g-4" id="galleryGrid" aria-live="polite"><div class="col-12 text-center py-5 text-muted">Loading Visual Archives…</div></div>
  </div>
</section>
<div class="property-gallery-modal" id="galleryLightboxModal" hidden role="dialog" aria-modal="true" aria-label="Gallery media viewer">
  <button type="button" class="property-gallery-close" id="galleryViewerClose" aria-label="Close gallery"><i class="bi bi-x-lg"></i></button>
  <div class="property-gallery-stage gallery-home-stage">
    <button type="button" class="property-gallery-arrow property-gallery-prev" id="galleryPrevious" aria-label="Previous media"><i class="bi bi-chevron-left"></i></button>
    <div id="lightboxMedia" class="gallery-home-media"></div>
    <button type="button" class="property-gallery-arrow property-gallery-next" id="galleryNext" aria-label="Next media"><i class="bi bi-chevron-right"></i></button>
    <div class="property-gallery-counter" id="lightboxCounter">1 / 1</div>
  </div>
  <div class="gallery-home-caption" id="lightboxCaption"><h3 id="lightboxTitle">Sacred Glimpse</h3><p id="lightboxDesc"></p></div>
  <div class="property-gallery-thumbnails-wrap">
    <button type="button" id="galleryThumbPrev" class="property-gallery-thumb-arrow" aria-label="Scroll thumbnails left"><i class="bi bi-chevron-left"></i></button>
    <div class="property-gallery-thumbnails" id="galleryViewerThumbnails"></div>
    <button type="button" id="galleryThumbNext" class="property-gallery-thumb-arrow" aria-label="Scroll thumbnails right"><i class="bi bi-chevron-right"></i></button>
  </div>
</div>
